version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: webservice/backend.dockerfile

    container_name: gophergpt-webservice

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: always

    volumes:
      - ./webservice/data:/app/data


  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.dockerfile

      args:
        REACT_APP_API_BASE: /api

    container_name: gophergpt-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: always


  nginx:
    image: nginx:alpine

    container_name: gophergpt-nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

    depends_on:
      - frontend
      - backend

    restart: always